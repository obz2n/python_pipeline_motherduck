name: ETL MotherDuck

on:
  schedule:
   - cron: "0 10 * * *"   # 10:00 UTC = 07:00 em Brasilia
  workflow_dispatch:        # permite rodar manualmente pelo botao "Run workflow"

permissions:
  contents: read

concurrency:
  group: etl
  cancel-in-progress: false  # nao sobrepoe execucoes

jobs:
  etl:
    name: Executar ETL diario
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Checkout do código"
        uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: "Informações do ambiente"
        run: |
          python --version
          pip --version

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: "Verificar variáveis de ambiente"
        run: |
          if [ -z "$MOTHERDUCK_TOKEN" ]; then
            echo "::error::Secret MOTHERDUCK_TOKEN está vazio ou não configurado no repositório."
            echo "Verifique em Settings > Secrets and variables > Actions se o secret 'MOTHERDUCK_TOKEN' existe"
            echo "e, se ele foi criado como 'Environment secret', adicione 'environment: <nome>' a este job."
            exit 1
          fi
          echo "MOTHERDUCK_TOKEN presente (tamanho: ${#MOTHERDUCK_TOKEN} caracteres)."
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}

      - name: Rodar pipeline
        run: python "${{ github.workspace }}/src/main.py"
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}